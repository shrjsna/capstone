[pytest]
# Restrict test discovery to the canonical test locations.
# Excludes: edge/zone_intrusion/tracking/track_test.py (manual camera script)
#           test_live_server.py (manual live-server script, not a pytest test)
#           venv/ (third-party packages)
testpaths = tests edge/zone_intrusion/tests
norecursedirs = venv .git __pycache__ .pytest_cache edge/zone_intrusion/tracking
