name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v

      - name: Lint check
        run: |
          pip install flake8
          # Fail only on actual errors, not style nitpicks, to keep this fast for a student team
          flake8 . --exclude=.venv,.pytest_cache --count --select=E9,F63,F7,F82 --show-source --statistics
